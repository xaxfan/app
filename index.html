<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="涂鸦">
<link rel="manifest" href="manifest.json">
<title>涂鸦</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #FFF8E7; font-family: -apple-system, 'Comic Sans MS', sans-serif; }

.page { display: none; width: 100%; height: 100%; flex-direction: column; }
.page.active { display: flex; }

/* === HOME PAGE === */
#home { align-items: center; justify-content: center; gap: 30px; }
#home h1 { font-size: 36px; color: #FF6B6B; }
.drawing-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.drawing-card {
  width: 140px; height: 160px; background: #fff; border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; gap: 10px;
  transition: transform 0.2s;
}
.drawing-card:active { transform: scale(0.93); }
.drawing-card canvas { width: 100px; height: 100px; }
.drawing-card span { font-size: 18px; font-weight: bold; color: #555; }

/* === DRAW PAGE === */
#draw-page { position: relative; }

.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #fff; border-bottom: 2px solid #f0e0c0;
  min-height: 56px;
}
.top-bar button {
  width: 50px; height: 50px; border-radius: 50%; border: none;
  background: #FFE0E0; font-size: 24px; cursor: pointer;
}
.top-bar button:active { transform: scale(0.9); }
.step-indicator { font-size: 18px; color: #888; font-weight: bold; }

.canvas-area { flex: 1; position: relative; background: #fff; }
.canvas-area canvas {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}
#guide-canvas { z-index: 1; pointer-events: none; }
#user-canvas { z-index: 2; pointer-events: none; }
#input-canvas { z-index: 3; cursor: crosshair; }

.bottom-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #fff; border-top: 2px solid #f0e0c0;
}
.bottom-left, .bottom-right { display: flex; align-items: center; gap: 8px; }
.bottom-center { display: flex; align-items: center; gap: 5px; }
.color-dot {
  width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent;
  cursor: pointer; transition: transform 0.15s, border-color 0.15s;
}
.color-dot.active { border-color: #333; transform: scale(1.2); }
.color-dot:active { transform: scale(0.9); }
.btn-action {
  width: 50px; height: 50px; border-radius: 50%; border: none;
  background: #FFE0E0; color: #555; font-size: 22px; cursor: pointer;
}
.btn-action:active { transform: scale(0.9); }
.btn-action.primary {
  background: #4CAF50; color: #fff;
  box-shadow: 0 3px 8px rgba(76,175,80,0.3);
}

/* === DONE PAGE === */
#done-page { align-items: center; justify-content: center; gap: 20px; }
#done-page h1 { font-size: 48px; }
#done-page p { font-size: 24px; color: #555; }
.btn-home {
  padding: 16px 40px; border-radius: 30px; border: none;
  background: #FF6B6B; color: #fff; font-size: 22px; cursor: pointer;
}

/* === SETTINGS MODAL === */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 20px; padding: 30px; width: 280px;
  text-align: center;
}
.modal h2 { margin-bottom: 20px; color: #555; }
.modal label {
  display: block; padding: 12px; margin: 8px 0; border-radius: 12px;
  background: #f5f5f5; cursor: pointer; font-size: 16px;
}
.modal label.selected { background: #FFE0E0; font-weight: bold; }
.modal button {
  margin-top: 16px; padding: 12px 30px; border-radius: 20px;
  border: none; background: #4CAF50; color: #fff; font-size: 18px; cursor: pointer;
}
</style>
</head>
<body>

<!-- HOME PAGE -->
<div id="home" class="page active">
  <h1>选一个画吧！</h1>
  <div class="drawing-grid" id="drawing-grid"></div>
</div>

<!-- DRAW PAGE -->
<div id="draw-page" class="page">
  <div class="top-bar">
    <button id="btn-back">←</button>
    <span class="step-indicator" id="step-indicator">1/6</span>
    <button id="btn-music" onclick="toggleMusic()" style="opacity:0.5">♪</button>
    <button id="btn-settings">⚙</button>
  </div>
  <div class="canvas-area" id="canvas-area">
    <canvas id="guide-canvas"></canvas>
    <canvas id="user-canvas"></canvas>
    <canvas id="input-canvas"></canvas>
  </div>
  <div class="bottom-bar">
    <div class="bottom-left">
      <button class="btn-action" id="btn-undo">↩</button>
    </div>
    <div class="bottom-center" id="color-bar"></div>
    <div class="bottom-right">
      <button class="btn-action primary" id="btn-next">→</button>
    </div>
  </div>
</div>

<!-- DONE PAGE -->
<div id="done-page" class="page">
  <h1>🎉</h1>
  <p>画完啦！真棒！</p>
  <canvas id="final-canvas"></canvas>
  <button class="btn-home" id="btn-new">再画一个</button>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>参考线设置</h2>
    <label data-mode="fade">画时变淡</label>
    <label data-mode="hide">画时消失</label>
    <label data-mode="keep">一直显示</label>
    <button id="btn-close-settings">确定</button>
  </div>
</div>

<script src="js/music.js"></script>
<script src="js/drawings.js"></script>
<script src="js/guide.js"></script>
<script src="js/canvas.js"></script>
<script>
// --- App State ---
let currentDrawing = null;
let currentStep = 0;
let userCanvas, guideCanvas, inputCanvas;
let guideCtx;

const COLORS = ['#FF0000','#FF8C00','#FFD700','#228B22','#00CED1','#4169E1','#8B008B'];

// --- Navigation ---
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// --- Home Page ---
function buildHome() {
  const grid = document.getElementById('drawing-grid');
  grid.innerHTML = '';
  for (const d of DRAWINGS) {
    const card = document.createElement('div');
    card.className = 'drawing-card';
    const cvs = document.createElement('canvas');
    cvs.width = 100; cvs.height = 100;
    const tctx = cvs.getContext('2d');
    drawThumbnail(tctx, d, 100);
    card.appendChild(cvs);
    const label = document.createElement('span');
    label.textContent = d.emoji + ' ' + d.name;
    card.appendChild(label);
    card.onclick = () => startDrawing(d);
    grid.appendChild(card);
  }
}

// --- Start Drawing ---
function startDrawing(d) {
  currentDrawing = d;
  currentStep = 0;
  strokes = [];
  showPage('draw-page');
  setupCanvases();
  setupColors();
  updateStep();
}

function setupCanvases() {
  const area = document.getElementById('canvas-area');
  guideCanvas = document.getElementById('guide-canvas');
  userCanvas = document.getElementById('user-canvas');
  inputCanvas = document.getElementById('input-canvas');

  const resize = () => {
    const w = area.clientWidth;
    const h = area.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    for (const c of [guideCanvas, userCanvas, inputCanvas]) {
      c.width = w * dpr;
      c.height = h * dpr;
      c.style.width = w + 'px';
      c.style.height = h + 'px';
    }
    redrawUserCanvas();
    requestRedraw();
  };

  resize();
  window.onresize = resize;
  initCanvas(inputCanvas);
}

function setupColors() {
  const bar = document.getElementById('color-bar');
  bar.innerHTML = '';
  COLORS.forEach((c, i) => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (i === 0 ? ' active' : '');
    dot.style.background = c;
    dot.onclick = () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
      currentColor = c;
    };
    bar.appendChild(dot);
  });
  currentColor = COLORS[0];
}

function updateStep() {
  const indicator = document.getElementById('step-indicator');
  indicator.textContent = `${currentStep + 1}/${currentDrawing.steps.length}`;
  resetGuideForStep();
  requestRedraw();
}

function requestRedraw() {
  // Redraw guide canvas
  const ctx = guideCanvas.getContext('2d');
  const t = getDrawTransform(guideCanvas);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
  ctx.scale(t.dpr, t.dpr);
  ctx.translate(t.offsetX, t.offsetY);
  ctx.scale(t.scale, t.scale);

  drawGuide(ctx, currentDrawing.steps[currentStep], currentStep, currentDrawing.steps);
  ctx.restore();
}

// --- Next Step ---
document.getElementById('btn-next').onclick = () => {
  if (strokes.length === 0) return; // must draw something first
  currentStep++;
  if (currentStep >= currentDrawing.steps.length) {
    showDone();
  } else {
    updateStep();
  }
};

// --- Undo ---
document.getElementById('btn-undo').onclick = () => undoStroke();

// --- Back ---
document.getElementById('btn-back').onclick = () => {
  showPage('home');
};

// --- Done ---
function showDone() {
  showPage('done-page');
  // Voice congratulation
  if ('speechSynthesis' in window) {
    const phrases = ['宸宸你真棒','宸宸你太厉害了吧','宸宸你真是妈妈的乖宝宝','宸宸你又厉害了'];
    const text = phrases[Math.floor(Math.random() * phrases.length)];
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.pitch = 1.3;
    speechSynthesis.speak(u);
  }
  // Show final artwork
  const fc = document.getElementById('final-canvas');
  // Match user canvas aspect ratio
  const srcW = userCanvas.width;
  const srcH = userCanvas.height;
  const maxW = Math.min(300, window.innerWidth * 0.8);
  const ratio = srcH / srcW;
  fc.width = maxW;
  fc.height = maxW * ratio;
  fc.style.width = maxW + 'px';
  fc.style.height = (maxW * ratio) + 'px';
  const fctx = fc.getContext('2d');
  fctx.clearRect(0, 0, fc.width, fc.height);
  // Copy user drawing scaled down
  const dpr = window.devicePixelRatio || 1;
  fctx.drawImage(userCanvas, 0, 0, userCanvas.width, userCanvas.height, 0, 0, fc.width, fc.height);
}

document.getElementById('btn-new').onclick = () => {
  showPage('home');
};

// --- Settings ---
document.getElementById('btn-settings').onclick = () => {
  const modal = document.getElementById('settings-modal');
  modal.classList.add('active');
  updateSettingsUI();
};
document.getElementById('btn-close-settings').onclick = () => {
  document.getElementById('settings-modal').classList.remove('active');
};

function updateSettingsUI() {
  document.querySelectorAll('#settings-modal label').forEach(l => {
    l.classList.toggle('selected', l.dataset.mode === guideMode);
  });
}
document.querySelectorAll('#settings-modal label').forEach(l => {
  l.onclick = () => {
    setGuideMode(l.dataset.mode);
    updateSettingsUI();
  };
});

// --- Init ---
buildHome();
</script>
</body>
</html>
